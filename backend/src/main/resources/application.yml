server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: wave-miner
  datasource:
    url: jdbc:sqlite:${app.data-dir}/wave-miner.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2100MB
  threads:
    virtual:
      enabled: true
app:
  data-dir: ./data
  max-concurrent-tasks: 2
  ffmpeg-path: ffmpeg
  ffprobe-path: ffprobe
  yt-dlp-path: yt-dlp
  process-timeout-seconds: 1800
  access-token: ""
  # —— 转写引擎（计划 2）——
  minimax-base-url: https://api.minimax.cn
  minimax-model: asr-1.0
  aliyun-base-url: https://dashscope.aliyuncs.com/api/v1
  aliyun-model: qwen-audio-3.0-asr-flash-filetrans
  engine-http-timeout-seconds: 600
  engine-retry-attempts: 3
  transcribe-poll-interval-seconds: 5
  transcribe-timeout-seconds: 7200
  silence-threshold-db: -35.0
  silence-min-duration-sec: 0.6
  merge-gap-ms: 800
